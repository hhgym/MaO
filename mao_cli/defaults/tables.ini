# Ausschließlich neutrale Platzhalter. Diese Datei wird mit dem Programm veröffentlicht.
# Echte Tabellen- und Viewnamen stehen NUR in MAO_CONFIG/tables.ini.
# Für SQL-Läufe ist eine zentrale, private tables.ini erforderlich.
[table]
orga_table = DEMO_ORGA
teachers_table = DEMO_TEACHERS
# Aktuelle Schuelerstammdaten-Tabelle (inkl. klasse, vorname, nachname, geschlecht)
students_table = DEMO_CURRENT_STUDENTS
# Aktuelle Lerngruppen-View, z. B. orga_view_lerngruppen_aktuell_sortiert (lerngruppe_schuljahr_id, lehrkraft_id, klassenname, typ)
current_groups_view = DEMO_CURRENT_GROUP_VIEW
# Alle aktuellen Lerngruppen (Klassen und Kurse) mit kl/stellvkl/mathel, z. B. orga_view_lerngruppen_aktuell_sortiert (Spalten lerngruppe, typ, stufe)
courses_table = DEMO_COURSES
rooms_table = DEMO_ROOMS
# Schulen Berlins (Auswahlliste der Externen), befüllt mit: mao schulen-sync
schools_table = DEMO_SCHOOLS
# Externe Teilnehmende (Grundschulen): Personen jahrgangsunabhängig, Teilnahmen je Jahrgang
extern_personen_table = DEMO_EXTERN_PERSONEN
extern_teilnahmen_table = DEMO_EXTERN_TEILNAHMEN
# View mit Matrikelnummer, Klasse (aktuell) und Punkte (Vorjahr; Zahl oder Text wie 'keine Teilnahme') für die Top-15 der Raumzuteilung
points_last_year_view = DEMO_POINTS_LAST_YEAR_VIEW
# View auf die Organisationstabelle mit ID- und Klartext-Spalten (raum, lehrkraft, kurs, preis)
orga_view = DEMO_ORGA_VIEW
pivot_view = DEMO_PIVOT_VIEW
einsatz_view = DEMO_EINSAETZE_VIEW
aufsichten_view = DEMO_AUFSICHTEN_VIEW
# Tabelle der Lehrkraft-Aufsichten (Jahrgang, Raum, Lehrkraft, Rolle); Prüfung mit: mao aufsichten
aufsichten_table = DEMO_AUFSICHTEN
# Optional: Fächer der Lehrkräfte (Zuordnung lehrkraft_id/fach_id und Fächertabelle mit Spalte Fach); damit zeigt
# mao aufsichten --interaktiv zuerst die Mathematik-Lehrkräfte
teacher_subjects_table = DEMO_TEACHER_SUBJECTS
subjects_table = DEMO_SUBJECTS
kopierliste_view = DEMO_KOPIERLISTE_VIEW
stats_klasse_view = DEMO_STATS_KLASSE_VIEW
stats_stufe_view = DEMO_STATS_STUFE_VIEW
stats_kurse_view = DEMO_STATS_KURSE_VIEW
stats_lehrkraft_view = DEMO_STATS_LEHRKRAFT_VIEW
stats_gesamt_view = DEMO_STATS_GESAMT_VIEW
jahrgaenge_table = DEMO_JAHRGAENGE
schuljahre_table = DEMO_SCHULJAHRE

# Jahrgangsarchiv – nur für die schreibgeschützte Initialisierungs-Vorprüfung
archive_table = DEMO_ARCHIVE
runden_table = DEMO_RUNDEN
teilnahmen_table = DEMO_TEILNAHMEN
# Einsätze der Oberstufe (Jahrgang, Matrikelnummer, Rolle, Modus, Gruppe, Raum, Quelle) und deren Rollen (Teilnahme, Aufsicht, Hof, 5PK); mao einsatz
oberstufe_einsaetze_table = DEMO_OBERSTUFE_EINSAETZE
oberstufe_rollen_table = DEMO_OBERSTUFE_ROLLEN
