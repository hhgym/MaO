latex:
  runs: 2
  engine: "lualatex"
  # tex: "@tex/<Ordner>/<Datei>.tex" liegt im Vorlagenordner <MaO>/tex (ein Ordner je Dokument,
  #   gemeinsame Präambel/Bilder in <MaO>/tex/base); ohne "@tex/" relativ zum workdir des Jobs.
  #   Die Vorlage findet ihre Dateien über den TeX-Suchpfad: \input{template.tex},
  #   \includegraphics{logo.png}. Exportdaten: \MaOdb<Unterordner/Datei.csv>; außerdem
  #   \MaO (Nummer), \MaOjahrgang, \MaOroot (Jahrgangsordner), \MaOtex (Vorlagenordner).
  #   db_dir (Standard db) legt fest, worauf \MaOdb zeigt.
  # pdf_name: LaTeX schreibt das PDF direkt unter diesem Namen (Platzhalter {mao}) in den
  #   workdir des Jobs; es entsteht keine zweite Kopie. Alternativ: copy_pdf {from, to}.
  # cleanup_aux: true löscht .aux/.log usw. nach erfolgreichem Lauf (Standard: aus;
  #   einmalig per `mao run --cleanup-latex` / `mao latex --cleanup-latex`).
  jobs:
    - name: korrekturlisten
      id: korrekturlisten
      enabled: false
      workdir: "Korrekturlisten"
      tex: "@tex/Korrekturlisten/Korrekturlisten.tex"
      jobname: "Korrekturlisten"
      define_mao: true
      pdf_name: "MaO_{mao}_Korrekturlisten"

    - name: raumuebersicht
      id: raumuebersicht
      enabled: false
      workdir: "Raumuebersicht"
      tex: "@tex/Raumuebersicht/Raumuebersicht.tex"
      jobname: "Raumuebersicht"
      define_mao: true
      pdf_name: "MaO_{mao}_Raumuebersicht"

    - name: anwesenheitslisten
      id: anwesenheitslisten
      enabled: false
      workdir: "Raum-Anwesenheitslisten"
      tex: "@tex/Raum-Anwesenheitslisten/Raum-Anwesenheitslisten.tex"
      jobname: "Raum-Anwesenheitslisten"
      define_mao: true
      pdf_name: "MaO_{mao}_Anwesenheitslisten"

    - name: teilnehmendenlisten
      id: teilnehmendenlisten
      enabled: false
      workdir: "Teilnehmendenlisten"
      tex: "@tex/Teilnehmendenlisten/Teilnehmendenlisten.tex"
      jobname: "Teilnehmendenlisten"
      define_mao: true
      pdf_name: "MaO_{mao}_Teilnehmendenlisten"

    - name: einsatz_oberstufe
      id: einsatz_oberstufe
      enabled: false
      workdir: "Einsatz-Oberstufe"
      tex: "@tex/Einsatz-Oberstufe/Einsatz-Oberstufe.tex"
      jobname: "Einsatz-Oberstufe"
      define_mao: true
      pdf_name: "MaO_{mao}_Einsatz-Oberstufe"

    - name: rueckgabelisten
      id: rueckgabelisten
      enabled: true
      workdir: "Rueckgabelisten"
      tex: "@tex/Rueckgabelisten/Rueckgabelisten.tex"
      jobname: "Rueckgabelisten"
      define_mao: true
      pdf_name: "MaO_{mao}_Rueckgabelisten"

    - name: urkunden
      id: urkunden
      enabled: true
      workdir: "Urkunden- und Unterschriftenlisten"
      tex: "@tex/Urkunden/Urkunden.tex"
      jobname: "Urkunden"
      define_mao: true
      pdf_name: "MaO_{mao}_Urkunden"

    - name: unterschriften
      id: unterschriften
      enabled: true
      workdir: "Urkunden- und Unterschriftenlisten"
      tex: "@tex/Unterschriftenlisten/Unterschriftenlisten.tex"
      jobname: "Unterschriftenlisten"
      define_mao: true
      pdf_name: "MaO_{mao}_Unterschriftenlisten"

    - name: kopierliste
      id: kopierliste
      enabled: false
      workdir: "Kopierliste"
      tex: "@tex/Kopierliste/Kopierliste.tex"
      jobname: "Kopierliste"
      define_mao: true
      pdf_name: "MaO_{mao}_Kopierliste"

    - name: abwesenheitsliste
      id: abwesenheitsliste
      enabled: true
      workdir: "Abwesenheitsliste"
      tex: "@tex/Abwesenheitsliste/Abwesenheitsliste.tex"
      jobname: "Abwesenheitsliste"
      define_mao: true
      pdf_name: "MaO_{mao}_Abwesenheitsliste"

    # Ergebnislisten-Varianten
    - name: ergebnis_nach_lehrkraft
      id: ergebnis_nach_lehrkraft
      enabled: true
      workdir: "Ergebnislisten"
      tex: "@tex/Ergebnislisten/Ergebnislisten.tex"
      jobname: "Ergebnislisten"
      define_mao: true
      extra_defs:
        - "\\def\\nachlehrer{1}"
      pdf_name: "Ergebnisse-MaO{mao}_nach_Lehrkraft"

    - name: ergebnis_nach_klassenstufe_vorname
      id: ergebnis_nach_klassenstufe_vorname
      enabled: true
      workdir: "Ergebnislisten"
      tex: "@tex/Ergebnislisten/Ergebnislisten.tex"
      jobname: "Ergebnislisten"
      define_mao: true
      extra_defs:
        - "\\def\\nachklassenstufe{1}"
      pdf_name: "Ergebnisse-MaO{mao}_nach_Klassenstufe_alphabetisch_Vorname"

    - name: ergebnis_nach_klassenstufe_rangliste
      id: ergebnis_nach_klassenstufe_rangliste
      enabled: true
      workdir: "Ergebnislisten"
      tex: "@tex/Ergebnislisten/Ergebnislisten.tex"
      jobname: "Ergebnislisten"
      define_mao: true
      extra_defs:
        - "\\def\\ranglisteklassenstufe{1}"
      pdf_name: "Ergebnisse-MaO{mao}_nach_Klassenstufe_Rangliste"

    - name: ergebnis_nach_klasse_vorname
      id: ergebnis_nach_klasse_vorname
      enabled: true
      workdir: "Ergebnislisten"
      tex: "@tex/Ergebnislisten/Ergebnislisten.tex"
      jobname: "Ergebnislisten"
      define_mao: true
      extra_defs:
        - "\\def\\nachklassen{1}"
      pdf_name: "Ergebnisse-MaO{mao}_nach_Klassen_alphabetisch_Vorname"

    - name: ergebnis_nach_klasse_rangliste
      id: ergebnis_nach_klasse_rangliste
      enabled: true
      workdir: "Ergebnislisten"
      tex: "@tex/Ergebnislisten/Ergebnislisten.tex"
      jobname: "Ergebnislisten"
      define_mao: true
      extra_defs:
        - "\\def\\ranglisteklasse{1}"
      pdf_name: "Ergebnisse-MaO{mao}_nach_Klassen_Rangliste"

    # Preisträger
    - name: preistraeger
      id: preistraeger
      enabled: true
      workdir: "Ergebnislisten"
      tex: "@tex/Ergebnislisten/Ergebnislisten.tex"
      jobname: "Ergebnislisten"
      define_mao: true
      extra_defs:
        - "\\def\\preistraeger{1}"
      pdf_name: "Preisträger-MaO{mao}"
    
    # Delegierte
    - name: delegierte
      id: delegierte
      enabled: true
      workdir: "Ergebnislisten"
      tex: "@tex/Ergebnislisten/Ergebnislisten.tex"
      jobname: "Ergebnislisten"
      define_mao: true
      extra_defs:
        - "\\def\\delegierte{1}"
      pdf_name: "Delegierte-MaO{mao}"

    # Delegierte
    - name: klassenleitungslisten
      id: klassenleitungslisten
      enabled: true
      workdir: "Klassenleitungslisten"
      tex: "@tex/Klassenleitungslisten/Klassenleitungslisten.tex"
      jobname: "Klassenleitungslisten"
      define_mao: true
      pdf_name: "Klassenleitungslisten-MaO{mao}"

    # Rückgabelisten
    - name: Rueckgabelisten
      id: rueckgabelisten_sek_i
      enabled: false
      workdir: "Rueckgabelisten"
      tex: "@tex/Rueckgabelisten/Rueckgabelisten.tex"
      jobname: "Rueckgabelisten"
      define_mao: true
      pdf_name: "Rueckgabelisten-MaO{mao}_nach_Klassen_und_Kurse"
