# =============================================================================
#  PIPELINE-KONFIGURATION (mao-cli)
#
#  Fachliche Definition der SQL-Datasets, CSV-Exporte und LaTeX-Jobs.
#  Der Python-Code enthält KEINE fachliche Logik mehr.
#
#  Gesteuert werden:
#    - Datenbankzugriff
#    - Laden von SQL-Datasets
#    - CSV-Exporte (inkl. Filter, Sortierung, Splits)
#    - Erzeugung von LaTeX-Makrodateien (datatool / pgffor)
#    - optionale LaTeX-Läufe
#
# =============================================================================


# -----------------------------------------------------------------------------
# db
#
# Optionale Konfiguration für die Datenbankverbindung.
# Ist die Datenbank nicht erreichbar, bricht der normale Lauf ab.
# Der Befehl `mao latex` erzeugt Dokumente auch ohne Datenbank.
# Bei `mao run` wird eine Datenbankverbindung benötigt. Vorhandene CSVs lassen sich dann für LaTeX nutzen.
# -----------------------------------------------------------------------------
# db:
#   connectivity_check:
#     timeout_sec: 2.0


# -----------------------------------------------------------------------------
# datasets
#
# Definition aller SQL-Abfragen.
# Jedes Dataset entspricht GENAU EINER SQL-Abfrage
# (Tabelle, View oder komplexes SELECT mit JOINs).
#
# Eigenschaften:
#   name     → eindeutiger Bezeichner
#   enabled  → false = Dataset wird nicht geladen
#   sql      → vollständige SQL-Abfrage
#
# Hinweise:
#   - JOINs gehören IMMER ins SQL, nicht in die Pipeline.
#   - Datasets werden vollständig geladen (kein WHERE hier).
# -----------------------------------------------------------------------------
# datasets:
#   - name: orga
#     enabled: true
#     sql: "SELECT * FROM {{table.orga_table}}"


# -----------------------------------------------------------------------------
# exports
#
# ZENTRALER Abschnitt.
#
# Ein Export beschreibt EIN fachliches Datenprodukt und kann erzeugen:
#   - eine Gesamt-CSV
#   - beliebig viele Split-CSVs
#   - eine LaTeX-Makrodatei
#
# -----------------------------------------------------------------------------
# exports:
#
#   - name: <frei>
#     enabled: true
#     from_dataset: <dataset-name>
#
#     -------------------------------------------------------------------------
#     filter (OPTIONAL)
#
#     Filter werden IN PYTHON angewendet (nach dem SQL).
#
#     Syntax:
#       - column: <spalte>
#         op: "==" | "!=" | "<" | "<=" | ">" | ">=" | "in" | "notin" | "contains" | "isnull" | "notnull"
#         value: <wert | [werte]>
#
#     -------------------------------------------------------------------------
#     rename (OPTIONAL)
#
#     Umbenennen von Spalten.
#     Wird VOR sort_by angewendet.
#
#     -------------------------------------------------------------------------
#     sort_by (OPTIONAL)
#
#     Sortierung der Daten.
#
#     Variante A (empfohlen):
#       sort_by:
#         - column: punkte
#           order: desc
#
#     Variante B (Kurzform, immer asc):
#       sort_by:
#         - klasse
#         - nachname
#
#     -------------------------------------------------------------------------
#     output (OPTIONAL)
#
#     Definition der Gesamt-CSV.
#
#       path: "<pfad>.csv"
#       sep: ";"            # default ";"
#       columns: "*" | [a,b,c]
#
#     -------------------------------------------------------------------------
#     splits (OPTIONAL)
#
#     Aufteilung eines Exports in mehrere CSV-Dateien.
#
#       - name: <frei>
#         enabled: true
#         by: <spalte>
#         filename_template: "<pfad>-{key}.csv"
#         on_missing_key: skip | error   (OPTIONAL, Standard skip)
#           → Zeilen ohne Wert in <spalte> (NULL oder leer) kommen in keine
#             Split-Datei. skip meldet die Anzahl im Protokoll, error bricht ab.
#
#         macro: (OPTIONAL)
#           → überschreibt export.macro
#
#     -------------------------------------------------------------------------
#     macro (OPTIONAL)
#
#     Steuert die Erzeugung einer LaTeX-Datei.
#     Kann auf Export- oder Split-Ebene stehen.
#
# -----------------------------------------------------------------------------
# macro:
#
#   enabled: true | false
#
#   tex_path: "<pfad>.tex"
#
#   db_prefix: "<Text>"
#     → Präfix für automatisch erzeugte DB-Namen
#     → Bindestriche "-" sind erlaubt
#
#   db_name: "<Name>"
#     → Fester DB-Name für Exporte OHNE Splits
#
#   list_macro: "<MakroName>"
#     → Erzeugt \newcommand{\MakroName}{...}
#
#   entry_template: "<Template>"   (EMPFOHLEN)
#
#     Platzhalter:
#       {db}        → normalisierter DB-Name (für \DTLloaddb)
#       {key}       → Split-Key
#       {<spalte>}  → JEDE Dataset-Spalte
#
#     Beispiel:
#       "{raum}/{db}"
#       "{klasse}/{lehrkraft}/{db}"
#
#     "/" ist ausdrücklich erlaubt (für pgffor), aber nur im Template selbst:
#     Spaltenwerte werden für TeX maskiert (% & # $ { } ^ ~ \); enthält ein
#     verwendeter Wert Komma, "/" oder Zeilenumbruch, bricht der Export mit
#     einer Fehlermeldung ab, statt eine falsche Liste zu schreiben.
#
#   label_template: "<Template>"   (LEGACY)
#     → wird nur verwendet, wenn entry_template fehlt
#
#   include_gesamt: true | false
#     → bindet Gesamt-CSV zusätzlich ein (nur bei Splits)
#
#   gesamt_db_name: "<Name>"
#     → DB-Name der Gesamtdatei (optional)
#
# -----------------------------------------------------------------------------
# Normalisierung von DB-Namen:
#
#   - Buchstaben A–Z / a–z
#   - Ziffern → ausgeschriebene Wörter
#   - Bindestriche "-" bleiben erhalten
#   - keine Umlaute oder Sonderzeichen
#
# Labels (entry_template) werden NICHT normalisiert.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# latex
#
# Optionale LaTeX-Läufe nach der CSV-/Makro-Erzeugung.
#
# latex:
#   engine: "lualatex" | "pdflatex"
#   runs: 2
#   jobs:
#     - name: <frei>
#       enabled: true
#       tex: "<datei>.tex"
#       out_dir: "<zielordner>"
#
# Wird ignoriert bei --no-latex.
# -----------------------------------------------------------------------------

db:
  connectivity_check:
    timeout_sec: 2.0

datasets:
  # ------------------------------------------------------------
  # Basistabellen
  # ------------------------------------------------------------
  - name: orga
    id: orga
    enabled: true
    # Die Basis-View löst die IDs der Organisationstabelle in Klartext-Spalten
    # auf (lehrkraft = Kürzel, kurs, raum, preis); ID-Spalten werden hier nicht ausgegeben.
    sql: |
      SELECT
      m.tnr,
      m.matrikelnummer,
      m.nachname,
      m.vorname,
      m.geschlecht,
      m.klasse,
      m.stufe,
      m.lehrkraft,
      COALESCE(m.kurs, '') AS kurs,
      m.raum,
      m.anwesenheit,
      m.bemerkung,
      m.aufgabe_1,
      m.aufgabe_2,
      m.aufgabe_3,
      m.aufgabe_4,
      m.punkte,
      m.preis,
      m.preisgeld,
      m.delegierung
      FROM {{table.orga_view}} m
    cast:
      aufgabe_1: Int64
      aufgabe_2: Int64
      aufgabe_3: Int64
      aufgabe_4: Int64
      punkte: Int64
      delegierung: Int64

  - name: orga_preis
    id: orga_preis
    enabled: true
    sql: |
      SELECT
      m.tnr,
      m.matrikelnummer,
      m.nachname,
      m.vorname,
      m.geschlecht,
      m.klasse,
      m.stufe,
      m.lehrkraft,
      COALESCE(m.kurs, '') AS kurs,
      m.raum,
      m.anwesenheit,
      m.bemerkung,
      m.aufgabe_1,
      m.aufgabe_2,
      m.aufgabe_3,
      m.aufgabe_4,
      m.punkte,
      m.preis,
      m.preisgeld,
      m.delegierung
      FROM {{table.orga_view}} m
      WHERE m.preis_id IS NOT NULL
    cast:
      punkte: Int64
      preisgeld: Int64
      delegierung: Int64

  - name: orga_delegierte
    id: orga_delegierte
    enabled: false
    sql: |
      SELECT *
      FROM {{table.orga_view}}
      WHERE delegierung IS NOT NULL


  - name: klassenleitungslisten
    id: klassenleitungslisten
    enabled: true
    sql: |
      SELECT 
      m.nachname,
      m.vorname,
      m.geschlecht,
      m.klasse,
      m.stufe,
      lg.kl,
      lg.stellvkl,
      lg.mathel,
      m.anwesenheit,
      m.aufgabe_1,
      m.aufgabe_2,
      m.aufgabe_3,
      m.aufgabe_4,
      m.punkte,
      m.preis,
      m.delegierung
      FROM {{table.orga_view}} m
      JOIN {{table.courses_table}} lg ON lg.lerngruppe = m.klasse AND lg.typ = 'klasse'
    cast:
      aufgabe_1: Int64
      aufgabe_2: Int64
      aufgabe_3: Int64
      aufgabe_4: Int64
      punkte: Int64
      delegierung: Int64

  - name: teachers
    id: teachers
    enabled: true
    sql: "SELECT * FROM {{table.teachers_table}}"

  - name: lerngruppeninformationen
    id: lerngruppeninformationen
    enabled: true
    sql: "SELECT * FROM {{table.courses_table}}"

  - name: rooms
    id: rooms
    enabled: true
    sql: "SELECT * FROM {{table.rooms_table}}"

  # ------------------------------------------------------------
  # Views (Organisation)
  # ------------------------------------------------------------
  - name: pivot_raum_stufe_ui
    id: pivot_raum_stufe_ui
    enabled: true
    sql: "SELECT * FROM {{table.pivot_view}}"

  - name: einsaetze_detail
    id: einsaetze_detail
    enabled: true
    sql: "SELECT * FROM {{table.einsatz_view}}"

  - name: aufsichten_mit_schueler
    id: aufsichten_mit_schueler
    enabled: true
    sql: "SELECT * FROM {{table.aufsichten_view}}"

  - name: kopierliste
    id: kopierliste
    enabled: true
    sql: "Select * FROM {{table.kopierliste_view}}"

  # ------------------------------------------------------------
  # Statistik-Views
  # ------------------------------------------------------------
  - name: stats_by_klasse
    id: stats_by_klasse
    enabled: true
    sql: "SELECT * FROM {{table.stats_klasse_view}}"

  - name: stats_by_stufe
    id: stats_by_stufe
    enabled: true
    sql: "SELECT * FROM {{table.stats_stufe_view}}"

  - name: stats_by_kurse
    id: stats_by_kurse
    enabled: true
    sql: "SELECT * FROM {{table.stats_kurse_view}}"

  - name: stats_by_lehrkraft
    id: stats_by_lehrkraft
    enabled: true
    sql: "SELECT * FROM {{table.stats_lehrkraft_view}}"

  - name: stats_by_gesamt
    id: stats_by_gesamt
    enabled: true
    sql: "SELECT * FROM {{table.stats_gesamt_view}}"

exports:
  # ------------------------------------------------------------
  # Basistabellen – Gesamt-Exports (Debug/Weiterverwendung)
  # ------------------------------------------------------------
  - name: orga_gesamt
    id: orga_gesamt
    enabled: false
    from_dataset: orga
    output:
      path: "db/Basis/Orga-gesamt.csv"
      sep: ";"
      columns: "*"
    macro:
      enabled: true
      tex_path: "db/Include/Tabellen-Orga-Gesamt.tex"
      db_prefix: "Orga"
      db_name: "OrgaGesamt"

  - name: teachers_gesamt
    id: teachers_gesamt
    enabled: false
    from_dataset: teachers
    output:
      path: "db/Basis/Lehrkraefte.csv"
      sep: ";"
      columns: "*"
    macro:
      enabled: false
      tex_path: "db/Include/Tabellen-Lehrkraefte-Gesamt.tex"
      db_prefix: "Lehrkraefte"
      db_name: "LehrkraefteTabelle"

  - name: courses_gesamt
    id: courses_gesamt
    enabled: false
    from_dataset: lerngruppeninformationen
    output:
      path: "db/Basis/Kurse.csv"
      sep: ";"
      columns: "*"
    macro:
      enabled: false
      tex_path: "db/Include/Tabellen-Kurse-Gesamt.tex"
      db_prefix: "Kurse"
      db_name: "KurseTabelle"

  - name: klassenleitungen
    id: klassenleitungen
    enabled: true
    from_dataset: lerngruppeninformationen
    filter:
      - column: stufe
        op: "<="
        value: 10
    output:
      path: "db/Lerngruppen/Klassenleitungen.csv"
      sep: ";"
      columns: ["lerngruppe","stufe","kl","stellvkl"]
    macro:
      enabled: true
      tex_path: "db/Include/Klassenleitungen.tex"
      db_name: "KlassenleitungenTabelle"

  - name: klassen-sek-i
    id: klassen_sek_i
    enabled: true
    from_dataset: lerngruppeninformationen
    filter:
      - column: stufe
        op: "<="
        value: 10
    output:
      path: "db/Lerngruppen/KlassenSekI.csv"
      sep: ";"
      columns: ["lerngruppe","stufe"]
    macro:
      enabled: true
      tex_path: "db/Include/KlassenSekI.tex"
      db_name: "KlassenSekITabelle"
      
  - name: rooms_gesamt
    id: rooms_gesamt
    enabled: false
    from_dataset: rooms
    output:
      path: "db/Basis/Raeume.csv"
      sep: ";"
      columns: "*"
    macro:
      enabled: false
      tex_path: "db/Include/Tabellen-Raeume-Gesamt.tex"
      db_prefix: "Raeume"
      db_name: "RaeumeTabelle"

  # ------------------------------------------------------------
  # Teilnehmende – wie früher: pro Stufe und pro Klasse
  # Hinweis: anwesenheit=1 wird berücksichtigt
  # ------------------------------------------------------------
  - name: teilnehmende
    id: teilnehmende
    enabled: true
    from_dataset: orga
    filter:
      - column: anwesenheit
        op: "=="
        value: 1
    output:
      sep: ";"
      columns: "*"
    sort_by: [stufe, klasse, vorname, nachname]
    splits:
      - name: stufe
        enabled: true
        by: "stufe"
        filename_template: "db/Teilnehmende/Stufe/Teilnehmende-Stufe-{key}.csv"
        macro:
          enabled: true
          tex_path: "db/Include/Tabellen-Teilnehmende-Stufe.tex"
          db_prefix: "Teilnehmende-Stufe"
          list_macro: "TeilnehmendeStufenListe"
          entry_template: "{stufe}/{db}"
      - name: klasse
        enabled: true
        by: "klasse"
        filename_template: "db/Teilnehmende/Klasse/Teilnehmende-Klasse-{key}.csv"
        macro:
          enabled: true
          tex_path: "db/Include/Tabellen-Teilnehmende-Klasse.tex"
          db_prefix: "Teilnehmende-Klasse"
          list_macro: "TeilnehmendeKlassenListe"
          entry_template: "{klasse}/{stufe}/{db}"
      - name: kurse
        enabled: true
        by: "kurs"
        filename_template: "db/Teilnehmende/Kurse/Teilnehmende-Kurse-{key}.csv"
        macro:
          enabled: true
          tex_path: "db/Include/Tabellen-Teilnehmende-Kurse.tex"
          db_prefix: "Teilnehmende-Kurs"
          list_macro: "TeilnehmendeKurseListe"
          entry_template: "{kurs}/{stufe}/{lehrkraft}/{db}"
      - name: lehrkraft
        enabled: true
        by: "lehrkraft"
        filename_template: "db/Teilnehmende/Lehrkraft/Teilnehmende-Lehrkraft-{key}.csv"
        macro:
          enabled: true
          tex_path: "db/Include/Tabellen-Teilnehmende-Lehrkraft.tex"
          db_prefix: "Teilnehmende-Lehrkraft"
          list_macro: "TeilnehmendeLehrkraftListe"
          entry_template: "{lehrkraft}/{db}"
  
  - name: abwesende
    id: abwesende
    enabled: true
    from_dataset: orga
    filter:
      - column: anwesenheit
        op: "=="
        value: 0
    output:
      sep: ";"
      columns: ["tnr","nachname","vorname","klasse","stufe"]
      path: "db/Abwesende/Abwesende.csv"

  # ------------------------------------------------------------
  # Organisation – Kopierliste
  # ------------------------------------------------------------
  - name: kopierliste
    id: kopierliste
    enabled: true
    from_dataset: kopierliste
    output:
      path: "db/Kopierliste/Kopierliste.csv"
      sep: ";"
      columns: "*"
    splits:
      - name: raum
        enabled: true
        by: "raum"
        filename_template: "db/Kopierliste/Kopierliste-Raum-{key}.csv"
    macro:
      enabled: true
      tex_path: "db/Include/Tabellen-Kopierliste.tex"
      include_gesamt: true
      gesamt_db_name: "Kopierliste"
      list_macro: "Kopierraumliste"
      db_prefix: "Kopierliste-Raum-"
      db_name: "Kopierliste"
      entry_template: "{raum}/{db}"

  # ------------------------------------------------------------
  # Ranglisten
  # ------------------------------------------------------------
  - name: gesamte rangliste
    id: gesamte_rangliste
    enabled: true
    from_dataset: orga
    filter:
      - column: anwesenheit
        op: "=="
        value: 1
    output:
      sep: ";"
      columns: ["nachname","vorname","geschlecht","klasse","stufe","anwesenheit","bemerkung","aufgabe_1","aufgabe_2","aufgabe_3","aufgabe_4","punkte","preis","preisgeld","delegierung"]
      path: "db/Rangliste/Rangliste-Gesamt.csv"
    macro:
      enabled: true
      tex_path: "db/Include/RanglisteGesamt.tex"
      db_name: "RanglisteGesamtTabelle"


  - name: rangliste nach stufe
    id: rangliste_nach_stufe
    enabled: true
    from_dataset: orga
    filter:
      - column: anwesenheit
        op: "=="
        value: 1
    output:
      sep: ";"
      columns: "*"
    sort_by:
      - column: stufe
        order: asc
      - column: punkte
        order: desc
    splits:
      - name: stufe
        enabled: true
        by: "stufe"
        filename_template: "db/Rangliste/Stufe/Rangliste-Stufe-{key}.csv"
        macro:
          enabled: true
          tex_path: "db/Include/Tabellen-Rangliste-Stufe.tex"
          db_prefix: "Rangliste-Stufe"
          list_macro: "RanglisteStufenListe"
          entry_template: "{stufe}/{db}"
      - name: klasse
        enabled: true
        by: "klasse"
        filename_template: "db/Rangliste/Klasse/Rangliste-Klasse-{key}.csv"
        macro:
          enabled: true
          tex_path: "db/Include/Tabellen-Rangliste-Klasse.tex"
          db_prefix: "Rangliste-Klasse"
          list_macro: "RanglisteKlasseListe"
          entry_template: "{klasse}/{db}"
      - name: lehrkraft
        enabled: true
        by: "lehrkraft"
        filename_template: "db/Rangliste/Lehrkraft/Rangliste-Lehrkraft-{key}.csv"
        macro:
          enabled: true
          tex_path: "db/Include/Tabellen-Rangliste-Lehrkraft.tex"
          db_prefix: "Rangliste-Lehrkraft"
          list_macro: "RanglisteLehrkraftListe"
          entry_template: "{lehrkraft}/{db}"

  - name: teilnehmende
    id: teilnehmende_2
    enabled: true
    from_dataset: orga
    filter:
      - column: anwesenheit
        op: "=="
        value: 1
      - column: kurs
        op: "!="
        value: ""
    output:
      sep: ";"
      columns: "*"
    sort_by:
      - column: punkte
        order: desc
    splits:
      - name: kurs
        enabled: true
        by: "kurs"
        filename_template: "db/Rangliste/Kurs/Rangliste-Kurs-{key}.csv"
        macro:
          enabled: true
          tex_path: "db/Include/Tabellen-Rangliste-Kurs.tex"
          db_prefix: "Rangliste-Kurs"
          list_macro: "RanglisteKursListe"
          entry_template: "{kurs}/{stufe}/{lehrkraft}/{db}"

  # ------------------------------------------------------------
  # Preistraeger:innen und Delegierte
  # ------------------------------------------------------------
  - name: preistraeger
    id: preistraeger
    enabled: true
    from_dataset: orga
    filter:
      - column: preis
        op: notnull
      - column: preis
        op: "!="
        value: ""
    output:
      sep: ";"
      columns: ["nachname","vorname","geschlecht","klasse","stufe","lehrkraft","kurs","punkte","preis","preisgeld","delegierung"]
      path: "db/Preistraeger-und-Delegierte/Preistraeger.csv"
    sort_by:
      - column: preis
        order: asc

  - name: delegierte
    id: delegierte
    enabled: true
    from_dataset: orga
    filter:
      - column: delegierung
        op: "=="
        value: 1
    output:
      sep: ";"
      columns: ["nachname","vorname","geschlecht","klasse","lehrkraft","kurs","punkte","preis","preisgeld","delegierung"]
      path: "db/Preistraeger-und-Delegierte/Delegierte.csv"
    sort_by:
      - column: stufe
        order: asc
      - column: vorname
        order: asc
  # ------------------------------------------------------------
  # Preisgelder
  # ------------------------------------------------------------ 
  - name: preisgeld
    id: preisgeld
    enabled: true
    from_dataset: orga_preis
    output:
      sep: ";"
      columns: ["nachname","vorname","geschlecht","klasse","lehrkraft","kurs","punkte","preis","preisgeld","delegierung"]
      path: "db/Preisgeld/Preisgeld-gesamt.csv"
    sort_by:
      - column: preis
        order: asc
      - column: stufe
        order: asc
      - column: klasse
        order: asc
      - column: vorname
        order: asc
      - column: nachname
        order: asc
  
  - name: preisgeld
    id: preisgeld_2
    enabled: true
    from_dataset: orga_preis
    filter:
      - column: klasse
        op: "notin"
        value: ["5-1","5-2","6-1","6-2","7-3","7-4"]
    output:
      sep: ";"
      columns: ["nachname","vorname","geschlecht","klasse","lehrkraft","kurs","punkte","preis","preisgeld","delegierung"]
    sort_by:
      - column: stufe
        order: asc
      - column: klasse
        order: asc
      - column: preis
        order: asc
      - column: vorname
        order: asc
      - column: nachname
        order: asc
    splits:
      - name: lehrkraft
        enabled: true
        by: "lehrkraft"
        filename_template: "db/Preisgeld/Lehrkraft/Preisgeld-Lehrkraft-{key}.csv"
        macro:
          enabled: true
          tex_path: "db/Include/Tabellen-Preisgeld-Lehrkraft.tex"
          db_prefix: "Preisgeld-Lehrkraft"
          list_macro: "PreisgeldLehrkraftListe"
          entry_template: "{lehrkraft}/{db}"
  
  - name: preisgeld_zentral
    id: preisgeld_zentral
    enabled: true
    from_dataset: orga_preis
    filter:
      - column: klasse
        op: "in"
        value: ["5-1","5-2","6-1","6-2","7-3","7-4"]
    output:
      sep: ";"
