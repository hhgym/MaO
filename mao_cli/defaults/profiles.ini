# NEU: Direkte Zuordnung zu den Export-IDs und LaTeX-Jobnamen in pipeline.yaml.
# enabled = nur YAML-seitig aktivierte Eintraege; all = alle Eintraege; none = keine.
# Listen sind kommagetrennt. Profile veraendern pipeline.yaml NICHT.
# Beachten: Profile sind Ausfuehrungsselektionen, keine Jahrgangs-/Datenbankwechsler.

[vorbereitung]
description = Klassen- und Raumlisten sowie Anwesenheitslisten
exports = klassenleitungen, klassen_sek_i, teilnehmende, kopierliste
latex_jobs = raumuebersicht, anwesenheitslisten, klassenleitungslisten

[turniertag]
description = Teilnehmer-, Abwesenheits- und Rueckgabelisten
exports = teilnehmende, abwesende, kopierliste
latex_jobs = teilnehmendenlisten, abwesenheitsliste, rueckgabelisten

[ergebnisse]
description = Ranglisten, Preislisten, Urkunden und Statistiken
exports = gesamte_rangliste, rangliste_nach_stufe, teilnehmende_2, preistraeger, delegierte, preisgeld, preisgeld_2, preisgeld_zentral, statistik_klasse, statistik_stufe, statistik_kurse, statistik_lehrkraft, statistik_gesamt
latex_jobs = urkunden, unterschriften, ergebnis_nach_lehrkraft, ergebnis_nach_klassenstufe_vorname, ergebnis_nach_klassenstufe_rangliste, ergebnis_nach_klasse_vorname, ergebnis_nach_klasse_rangliste, preistraeger, delegierte

[vollpaket]
description = Entspricht dem bisherigen Standardlauf der aktivierten Eintraege
exports = enabled
latex_jobs = enabled
