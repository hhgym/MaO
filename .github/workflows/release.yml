name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check release source and tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo 'Tag nicht auf main enthalten'; exit 1; }
          python -m pip install packaging
          python - <<'PY'
          import os, pathlib, sys, tomllib
          from packaging.version import Version
          current = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          tag = os.environ['TAG']
          if not tag.startswith('v') or Version(tag[1:]) != Version(current):
              sys.exit(f'Tag {tag} entspricht nicht pyproject Version {current}')
          PY
      - run: python -m pip install -e '.[dev]' build
      - run: python -m pytest -q
      - name: Initialize temporary central configuration
        env:
          MAO_CONFIG: ${{ runner.temp }}/mao-config
        run: python -m mao_cli config init
      - name: Validate packaged configuration
        env:
          MAO_CONFIG: ${{ runner.temp }}/mao-config
        run: python -m mao_cli validate
      - run: python -m build --wheel
      - name: Generate SHA256 sidecars
        run: for f in dist/*.whl; do sha256sum "$f" > "$f.sha256"; done
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *-rc.*|*.dev*|*a[0-9]*|*b[0-9]*) prerelease='--prerelease' ;;
            *) prerelease='' ;;
          esac
          gh release create "$TAG" dist/* --title "$TAG" --generate-notes $prerelease
