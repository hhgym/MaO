name: CI
on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Dependencies
        run: python -m pip install -e '.[dev]'
      - name: Regression tests
        run: python -m pytest -q
      - name: Initialize temporary central configuration
        env:
          MAO_CONFIG: ${{ runner.temp }}/mao-config
        run: python -m mao_cli config init
      - name: Validate packaged configuration
        env:
          MAO_CONFIG: ${{ runner.temp }}/mao-config
        run: python -m mao_cli validate
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: python -m ruff check mao_cli tests scripts
      - name: Mypy
        run: python -m mypy mao_cli
