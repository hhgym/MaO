name: CI
on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Dependencies
        run: python -m pip install -e '.[dev]'
      - name: Regression tests
        run: python -m pytest -q
      - name: Initialize temporary central configuration
        env:
          MAO_CONFIG: ${{ runner.temp }}/mao-config
        run: python -m mao_cli config init
      - name: Validate packaged configuration
        env:
          MAO_CONFIG: ${{ runner.temp }}/mao-config
        run: python -m mao_cli validate
  develop-build:
    permissions:
      contents: write  # Öffentliches Develop-Release veröffentlichen
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build
      - name: Stamp develop wheel with commit ID
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          sha = os.environ['COMMIT_SHA'].lower()
          assert re.fullmatch(r'[0-9a-f]{40}', sha)
          meta = pathlib.Path('pyproject.toml')
          package = pathlib.Path('mao_cli/__init__.py')
          base = re.search(r'^version = "([^"]+)"$', meta.read_text(), re.M).group(1)
          assert '+' not in base and ('.dev' in base or 'rc' in base)
          current = re.search(r'^__version__ = "([^"]+)"$', package.read_text(), re.M).group(1)
          assert base == current
          version = base + '+g' + sha[:12]
          meta.write_text(meta.read_text().replace(f'version = "{base}"', f'version = "{version}"'))
          package.write_text(package.read_text().replace(f'__version__ = "{base}"', f'__version__ = "{version}"'))
          print(f'Build-Version: {version}')
          PY
      - run: python -m build --wheel
      - name: Smoke test built Wheel in clean environment
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, tomllib, venv
          root = pathlib.Path('wheel-smoke-env')
          venv.EnvBuilder(with_pip=True).create(root)
          python = root / 'bin' / 'python'
          wheel, = pathlib.Path('dist').glob('*.whl')
          subprocess.run([str(python), '-m', 'pip', 'install', '--disable-pip-version-check', str(wheel.resolve())], check=True)
          result = subprocess.run([str(python), '-I', '-m', 'mao_cli', '--version'], capture_output=True, text=True, check=True)
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert version.endswith('+g' + os.environ['COMMIT_SHA'][:12])
          expected = 'mao ' + version
          assert result.stdout.strip() == expected, (result.stdout, result.stderr, expected)
          print('Isolated Wheel CLI OK:', expected)
          PY
      - name: Checksum
        run: (cd dist && for f in *.whl; do sha256sum "$f" > "$f.sha256"; done)
      - uses: actions/upload-artifact@v4
        with:
          name: mao-develop-${{ github.sha }}
          path: dist/
          retention-days: 30
      - name: Develop-Wheel öffentlich als GitHub-Release-Datei bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="develop-build"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" dist/*.whl dist/*.sha256 \
              --prerelease --latest=false --target "$COMMIT_SHA" \
              --title "MaO Develop-Builds" \
              --notes "Automatisch gebaute Entwicklungsversionen. Jedes Wheel trägt die Commit-ID. Nicht als stabile Version verwenden."
          else
            for f in dist/*.whl dist/*.sha256; do
              filename="${f##*/}"
              if ! gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq -- "$filename"; then
                gh release upload "$tag" "$f"
              fi
            done
          fi
