[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mao-cli"
version = "0.6.0.dev0"
description = "CLI zur Organisation der Mathematik-Olympiade (SQL, CSV, LaTeX)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "PyYAML>=6.0",
  "packaging>=23",
  "python-dateutil>=2.8",
  "mysql-connector-python>=8.0",
  "requests-oauthlib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "tomli>=2;python_version < '3.11'", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
mao = "mao_cli.cli:main"

[tool.setuptools.packages.find]
include = ["mao_cli*"]

[tool.setuptools.package-data]
mao_cli = ["defaults/*.yaml", "defaults/*.ini", "defaults/*.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Zunächst nur echte Fehler (Pyflakes, Syntax); weitere Regeln schrittweise.
select = ["F", "E9"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

# Drittbibliotheken einheitlich als Any behandeln – unabhängig davon, ob die
# installierte Version Typinformationen mitbringt. So liefert mypy lokal und
# in der CI dasselbe Ergebnis.
[[tool.mypy.overrides]]
module = ["mysql", "mysql.*", "pandas", "pandas.*", "yaml", "yaml.*", "dateutil", "dateutil.*",
          "requests", "requests.*", "requests_oauthlib", "requests_oauthlib.*", "urllib3", "urllib3.*",
          "tomli"]
follow_imports = "skip"
follow_imports_for_stubs = true
